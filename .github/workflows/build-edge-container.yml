name: Build Vultr edge container

on:
  pull_request:
    paths:
      - ".github/workflows/build-edge-container.yml"
      - "routing/Dockerfile"
      - "routing/render-bird-config"
      - "routing/policy.conf"
      - "routing/source-validation.nft"
      - ".github/workflows/validate-bird.yml"
      - "routing/edge/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-edge-container.yml"
      - "routing/Dockerfile"
      - "routing/render-bird-config"
      - "routing/policy.conf"
      - "routing/source-validation.nft"
      - ".github/workflows/validate-bird.yml"
      - "routing/edge/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: vultr-edge-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.matrix.outputs.build-matrix }}
      has-build: ${{ steps.matrix.outputs.has-build }}
      merge-matrix: ${{ steps.matrix.outputs.merge-matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select affected edges
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed() {
            ! git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- "$@"
          }
          build='[]'
          merge='[]'
          add_edge() {
            edge=$1
            image=$2
            build=$(jq -c --arg edge "$edge" --arg image "$image" '. + [
              {edge: $edge, image: $image, architecture: "amd64", platform: "linux/amd64", runner: "ubuntu-24.04"},
              {edge: $edge, image: $image, architecture: "arm64", platform: "linux/arm64", runner: "ubuntu-24.04-arm"}
            ]' <<< "$build")
            merge=$(jq -c --arg edge "$edge" --arg image "$image" '. + [{edge: $edge, image: $image}]' <<< "$merge")
          }
          common_changed=false
          if changed routing/Dockerfile routing/render-bird-config routing/policy.conf routing/source-validation.nft; then
            common_changed=true
          fi
          if [ "$common_changed" = true ] || changed routing/edge/vultr; then add_edge vultr as218822-vultr-edge; fi
          if [ "$common_changed" = true ] || changed routing/edge/gre-gateway; then add_edge gre-gateway as218822-gre-gateway; fi
          echo "build-matrix={\"include\":$build}" >> "$GITHUB_OUTPUT"
          echo "has-build=$(jq -r 'length > 0' <<< "$build")" >> "$GITHUB_OUTPUT"
          echo "merge-matrix={\"include\":$merge}" >> "$GITHUB_OUTPUT"

  validate:
    uses: ./.github/workflows/validate-bird.yml

  build:
    if: needs.changes.outputs.has-build == 'true'
    needs: [changes, validate]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: routing
          build-args: CONFIG_ROOT=edge/${{ matrix.edge }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ matrix.image }}:${{ matrix.architecture }}
          cache-from: type=gha,scope=${{ matrix.edge }}-edge-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.edge }}-edge-${{ matrix.architecture }}

      - name: Build and push image by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: routing
          build-args: CONFIG_ROOT=edge/${{ matrix.edge }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/pmh-only/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.edge }}-edge-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.edge }}-edge-${{ matrix.architecture }}

      - name: Export image digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edge }}-edge-digest-${{ matrix.architecture }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request' && needs.changes.outputs.has-build == 'true'
    needs: [changes, build]
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.merge-matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.edge }}-edge-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/pmh-only/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Merge and publish manifests
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/pmh-only/${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            if [ -n "$tag" ]; then
              tag_args+=(--tag "$tag")
            fi
          done

          digest_args=()
          for digest in *; do
            digest_args+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect published image
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/pmh-only/${{ matrix.image }}:latest"
