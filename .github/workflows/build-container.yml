name: Build AS218822 containers

on:
  pull_request:
    paths:
      - ".github/workflows/build-container.yml"
      - "atlas/**"
      - "console/**"
      - "pnpm-lock.yaml"
      - "routing/Dockerfile"
      - "routing/render-bird-config"
      - "routing/policy.conf"
      - "routing/source-validation.nft"
      - "routing/bird/**"
      - "routing/tunnels/**"
      - "routing/looking-glass/**"
      - "routing/spoofer/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-container.yml"
      - "atlas/**"
      - "console/**"
      - "pnpm-lock.yaml"
      - "routing/Dockerfile"
      - "routing/render-bird-config"
      - "routing/policy.conf"
      - "routing/source-validation.nft"
      - "routing/bird/**"
      - "routing/tunnels/**"
      - "routing/looking-glass/**"
      - "routing/spoofer/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: bird-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.matrix.outputs.build-matrix }}
      has-build: ${{ steps.matrix.outputs.has-build }}
      merge-matrix: ${{ steps.matrix.outputs.merge-matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select affected components
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed() {
            ! git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- "$@"
          }
          build='[]'
          merge='[]'
          add_component() {
            component=$1
            image=$2
            context=$3
            build=$(jq -c --arg component "$component" --arg image "$image" --arg context "$context" '. + [
              {component: $component, image: $image, context: $context, architecture: "amd64", platform: "linux/amd64", runner: "ubuntu-24.04"},
              {component: $component, image: $image, context: $context, architecture: "arm64", platform: "linux/arm64", runner: "ubuntu-24.04-arm"}
            ]' <<< "$build")
            merge=$(jq -c --arg component "$component" --arg image "$image" '. + [{component: $component, image: $image}]' <<< "$merge")
          }
          if changed atlas; then add_component ripe-atlas as218822-ripe-atlas atlas; fi
          if changed console pnpm-lock.yaml; then add_component console as218822-console console; fi
          if changed routing/Dockerfile routing/render-bird-config routing/policy.conf routing/source-validation.nft routing/bird routing/tunnels; then
            add_component bird as218822 routing
          fi
          if changed routing/looking-glass; then add_component looking-glass as218822-looking-glass routing/looking-glass; fi
          if changed routing/spoofer; then add_component spoofer as218822 routing/spoofer; fi
          echo "build-matrix={\"include\":$build}" >> "$GITHUB_OUTPUT"
          echo "has-build=$(jq -r 'length > 0' <<< "$build")" >> "$GITHUB_OUTPUT"
          echo "merge-matrix={\"include\":$merge}" >> "$GITHUB_OUTPUT"

  validate:
    uses: ./.github/workflows/validate-bird.yml

  build:
    if: needs.changes.outputs.has-build == 'true'
    needs: [changes, validate]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ matrix.image }}:${{ matrix.architecture }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.architecture }}

      - name: Build and push image by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/pmh-only/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.architecture }}

      - name: Test Atlas registration address families
        if: matrix.component == 'ripe-atlas'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          LOCAL_IMAGE: ${{ matrix.image }}:${{ matrix.architecture }}
          REMOTE_IMAGE: ${{ env.REGISTRY }}/pmh-only/${{ matrix.image }}
        run: |
          image="$LOCAL_IMAGE"
          if [ -n "$DIGEST" ]; then image="$REMOTE_IMAGE@$DIGEST"; fi
          for family in inet inet6 any; do
            docker run --rm --network none --entrypoint sh \
              --env SSH_ADDRESS_FAMILY="$family" \
              --volume "$PWD/atlas/test-entrypoint.sh:/test-entrypoint.sh:ro" \
              "$image" /test-entrypoint.sh
          done

      - name: Export image digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-digest-${{ matrix.architecture }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request' && needs.changes.outputs.has-build == 'true'
    needs: [changes, build]
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.merge-matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.component }}-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/pmh-only/${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.component == 'spoofer' && 'spoofer' || 'latest' }},enable={{is_default_branch}}
            type=sha,prefix=${{ matrix.component == 'spoofer' && 'spoofer-sha-' || 'sha-' }}

      - name: Merge and publish manifests
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/pmh-only/${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            if [ -n "$tag" ]; then
              tag_args+=(--tag "$tag")
            fi
          done

          digest_args=()
          for digest in *; do
            digest_args+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect published image
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/pmh-only/${{ matrix.image }}:${{ matrix.component == 'spoofer' && 'spoofer' || 'latest' }}"
