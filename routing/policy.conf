roa6 table rpki6;

define LUNALIGHT_PREFIXES = [2a0f:6284:b::/48, 2a0f:6284:c::/48];

protocol rpki rpki_cache {
    roa6 { table rpki6; };
    remote "rpki.as218822.svc.cluster.local" port 3323;
    retry keep 30;
    refresh keep 600;
    expire keep 7200;
}

# Keep public transit routes separate from tunnel addressing and local origins.
function valid_public_v6() {
    if net !~ [2000::/3{12,48}] then return false;
    if net ~ [2a06:9801:ff0::/44+] then return false;
    if net ~ [2001:2::/48+, 2001:10::/28+, 2001:20::/28+,
              2001:db8::/32+, 2002::/16+, 3fff::/20+] then return false;
    if bgp_path.len = 0 || bgp_path.len > 64 then return false;
    if bgp_path ~ [0, 23456, 64496..65535, 4200000000..4294967295] then return false;
    if roa_check(rpki6, net, bgp_path.last) = ROA_INVALID then return false;
    return true;
}

# This adjacency may originate only its reviewed prefixes, not provide transit.
function valid_lunalight_v6() {
    if net !~ LUNALIGHT_PREFIXES then return false;
    if !valid_public_v6() then return false;
    if bgp_path !~ [= 201423+ =] then return false;
    return roa_check(rpki6, net, 201423) = ROA_VALID;
}
