# Bilateral EVIX peering requested in GitHub issue #1.
filter import_hfs_evix_v6 {
    if !valid_public_v6() then reject;
    if net != 2620:35:2000::/48 then reject;
    if bgp_path !~ [= 402602+ =] then reject;
    if roa_check(rpki6, net, 402602) != ROA_VALID then reject;
    bgp_local_pref = 320;
    accept;
}

protocol bgp hfs_evix_v6 from route_server_v6 {
    neighbor 2602:fed2:fff:ffff::24 as 402602;
    source address 2602:fed2:fff:ffff:6::11d;
    enforce first as on;

    ipv6 {
        import filter import_hfs_evix_v6;
        receive limit 48 action disable;
        import limit 48 action disable;
    };
}
