protocol bgp freetransit_fra_v6 from upstream_v6 {
    neighbor 2a01:20e:1000:124::1 as 41051;
    source address 2a01:20e:1000:124::2;

    ipv6 {
        import filter {
            if !valid_public_v6() then reject;
            bgp_local_pref = 200;
            accept;
        };
        import limit 500000 action restart;
    };
}
