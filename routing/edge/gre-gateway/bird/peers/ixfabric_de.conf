template bgp ixfabric_de from route_server_v6 {
    source address 2a0e:8f01:1000:24::12a;

    ipv6 {
        import filter {
            if !valid_public_v6() then reject;
            bgp_local_pref = 310;
            accept;
        };
        import limit 500000 action restart;
    };
}

protocol bgp ixfabric_de_rs1 from ixfabric_de {
    neighbor 2a0e:8f01:1000:24::1 as 24381;
}

protocol bgp ixfabric_de_rs2 from ixfabric_de {
    neighbor 2a0e:8f01:1000:24::2 as 24381;
}
