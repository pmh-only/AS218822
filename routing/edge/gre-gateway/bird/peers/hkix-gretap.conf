protocol bgp hkix_gretap_v6 from route_server_v6 {
    neighbor 2602:f92a:1315:2::1 as 203168;
    source address 2602:f92a:1315:2::b5;

    ipv6 {
        import filter {
            if !valid_public_v6() then reject;
            bgp_local_pref = 310;
            accept;
        };
        import limit 500000 action restart;
    };
}

protocol bgp p7ix_hk_bgpexchange_v6 from route_server_v6 {
    neighbor 2602:f92a:1315:2::36 as 24381;
    source address 2602:f92a:1315:2::b5;

    ipv6 {
        import filter {
            if !valid_public_v6() then reject;
            bgp_local_pref = 310;
            accept;
        };
        import limit 500000 action restart;
    };
}
