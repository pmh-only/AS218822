template bgp ixfabric_nl from route_server_v6 {
    source address 2a0e:8f01:1000:11::1c4;

    ipv6 {
        import filter {
            if !valid_public_v6() then reject;
            bgp_local_pref = 310;
            accept;
        };
        import limit 500000 action restart;
    };
}

protocol bgp ixfabric_nl_rs1 from ixfabric_nl {
    neighbor 2a0e:8f01:1000:11::1 as 24381;
}

protocol bgp ixfabric_nl_rs2 from ixfabric_nl {
    neighbor 2a0e:8f01:1000:11::2 as 24381;
}

protocol bgp ixfabric_nl_rs3 from ixfabric_nl {
    neighbor 2a0e:8f01:1000:11::3 as 24381;
}
