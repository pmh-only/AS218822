protocol bgp ixfabric_tw from route_server_v6 {
    source address 2a0e:8f01:1000:78::105;
    neighbor 2a0e:8f01:1000:78::1 as 24381;

    ipv6 {
        import filter {
            if !valid_public_v6() then reject;
            bgp_local_pref = 310;
            accept;
        };
        import limit 500000 action restart;
    };
}
