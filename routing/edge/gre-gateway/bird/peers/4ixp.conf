template bgp ixp4_rs_v6 from upstream_v6 {
    source address 2001:7f8:d0::3:56c6:1;

    ipv6 {
        import filter {
            if !valid_public_v6() then reject;
            bgp_local_pref = 300;
            accept;
        };
        import limit 500000 action restart;
    };
}

protocol bgp ixp4_rs1_v6 from ixp4_rs_v6 { neighbor 2001:7f8:d0::8b7c:1 as 35708; }
protocol bgp ixp4_rs2_v6 from ixp4_rs_v6 { neighbor 2001:7f8:d0::8b7c:2 as 35708; }
protocol bgp ixp4_rs3_v6 from ixp4_rs_v6 { neighbor 2001:7f8:d0::8b7c:3 as 35708; }
