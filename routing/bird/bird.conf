log stderr all;

include "/etc/bird/local.conf";

define LOCAL_AS = 218822;
define OWN_PREFIX = 2a06:9801:ff0::/44;
define EXIT_ADDRESS = 2a06:9801:ff0::;
include "/etc/bird-policy.conf";

ipv6 table vultr6;

protocol device {
    scan time 10;
}

protocol direct direct_v6 {
    ipv6;
}

# Originate the aggregate and discard unmatched traffic. More-specific kernel
# routes still win by longest-prefix match.
protocol static originated_v6 {
    ipv6;
    route OWN_PREFIX blackhole;
}

protocol static tunnel_nexthops_v6 {
    ipv6;
    route fd00:200:21:1::17/128 via "hyehost-uk";
    route fd00:200:120:1::8/128 via "hyehost-us";
    route fd00:200:64:1::5/128 via "hyehost-nz";
}

filter export_own_v6 {
    if net = OWN_PREFIX && source = RTS_STATIC then accept;
    if source = RTS_BGP && proto = "gre_gateway_v6" && valid_lunalight_v6() then accept;
    reject;
}

filter export_backup_v6 {
    if net = OWN_PREFIX && source = RTS_STATIC then {
        bgp_path.prepend(LOCAL_AS);
        bgp_path.prepend(LOCAL_AS);
        bgp_path.prepend(LOCAL_AS);
        accept;
    }
    if source = RTS_BGP && proto = "gre_gateway_v6" && valid_lunalight_v6() then accept;
    reject;
}

filter export_kernel_v6 {
    if net = OWN_PREFIX && source = RTS_STATIC then accept;
    if net ~ [
        fd00:200:21:1::17/128,
        fd00:200:120:1::8/128,
        fd00:200:64:1::5/128
    ] && source = RTS_STATIC then accept;
    if source = RTS_BGP then {
        krt_prefsrc = EXIT_ADDRESS;
        accept;
    }
    reject;
}

protocol kernel kernel_v6 {
    # Full-table bursts must not overflow the netlink receive socket.
    netlink rx buffer 16777216;
    ipv6 {
        import none;
        export filter export_kernel_v6;
    };
    # Device-only WireGuard nexthops cannot safely be merged into Linux ECMP.
    merge paths off;
}

protocol pipe vultr_routes_v6 {
    table master6;
    peer table vultr6;
    import none;
    export filter {
        if net = ::/0 && proto = "vultr_edge_v6" then accept;
        reject;
    };
}

protocol kernel kernel_vultr_v6 {
    kernel table 218822;
    ipv6 {
        table vultr6;
        import none;
        export filter {
            krt_prefsrc = EXIT_ADDRESS;
            accept;
        };
    };
}

template bgp upstream_v6 {
    local as LOCAL_AS;
    graceful restart on;

    ipv6 {
        import table on;
        export table on;
        import none;
        export filter export_backup_v6;
    };
}

include "/run/bird/peers/*.conf";
