protocol bgp he_collector_v6 {
    description "HE Super Looking Glass";
    local 2a06:9801:ff0:: as LOCAL_AS;
    neighbor 2600:7000:1000::11 as 393338;
    multihop 64;

    ipv6 {
        import none;
        export table on;
        # Share the public routing table, never internal or control routes.
        export filter {
            if net = OWN_PREFIX && source = RTS_STATIC then accept;
            if source = RTS_BGP && valid_public_v6() then accept;
            reject;
        };
        next hop self;
    };
}
