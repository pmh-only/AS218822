ipv6 table customer6;

protocol static customer_roas {
    roa6 { table rpki6; };
    route 2a0f:6284:b::/48 max 48 as 201423;
    route 2a0f:6284:c::/48 max 48 as 201423;
    # Even a valid ROA for another origin must not widen the customer contract.
    route 2a0f:6284:b::/48 max 48 as 13335;
}

protocol static conflicting_customer_roa {
    roa6 { table rpki6; };
    route 2a0f:6284:c::/48 max 48 as 13335;
}

template static customer_fixture {
    ipv6 { table customer6; };
}

protocol static customer_valid from customer_fixture {
    route 2a0f:6284:b::/48 blackhole {
        bgp_path.empty;
        bgp_path.prepend(201423);
    };
    route 2a0f:6284:c::/48 blackhole {
        bgp_path.empty;
        bgp_path.prepend(201423);
        bgp_path.prepend(201423);
    };
}

protocol static customer_wrong_origin from customer_fixture {
    route 2a0f:6284:b::/48 blackhole {
        bgp_path.empty;
        bgp_path.prepend(13335);
        bgp_path.prepend(201423);
    };
}

protocol static customer_transit from customer_fixture {
    route 2a0f:6284:b::/48 blackhole {
        bgp_path.empty;
        bgp_path.prepend(201423);
        bgp_path.prepend(13335);
        bgp_path.prepend(201423);
    };
}

protocol static customer_wrong_neighbor from customer_fixture {
    route 2a0f:6284:b::/48 blackhole {
        bgp_path.empty;
        bgp_path.prepend(201423);
        bgp_path.prepend(13335);
    };
}

protocol static customer_empty_path from customer_fixture {
    route 2a0f:6284:b::/48 blackhole { bgp_path.empty; };
}

protocol static customer_wrong_prefix from customer_fixture {
    ipv6 {
        import filter {
            bgp_path.empty;
            bgp_path.prepend(201423);
            accept;
        };
    };
    route 2a0f:6284:b::/49 blackhole;
    route 2a0f:6284::/32 blackhole;
    route 2a0f:6284:d::/48 blackhole;
    route 2a06:9801:ff0::/44 blackhole;
    route ::/0 blackhole;
}
